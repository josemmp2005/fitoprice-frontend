# Despliegue del frontend en Netlify. La URL de la API se configura en Netlify
# (Site configuration > Environment variables): VITE_API_URL=https://<tu-api>.vercel.app
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Los archivos de assets llevan hash en el nombre: se pueden guardar en caché para siempre
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
